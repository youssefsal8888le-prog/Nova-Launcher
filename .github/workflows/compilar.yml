name: Nova Launcher Build Final
on:
  push:
    branches: [ v3_openjdk ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - name: Fix Missing Components
        run: |
          # Creamos las carpetas que el compilador busca
          mkdir -p app_novalauncher/src/main/assets/components/lwjgl3
          mkdir -p app_novalauncher/src/main/assets/components/jre
          
          # Creamos archivos de version falsos para que no den error de 'File not found'
          echo "3.3.3" > app_novalauncher/src/main/assets/components/lwjgl3/version
          echo "8" > app_novalauncher/src/main/assets/components/jre/version
          
          # Aseguramos que los scripts de idiomas funcionen
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
      - name: Build Nova Launcher APK
        run: |
          chmod +x gradlew
          # Compilamos ignorando las tareas que dan problemas de dependencias externas
          ./gradlew :app_novalauncher:assembleDebug -x :jre_lwjgl3glfw:build --no-daemon
          
          # Buscamos el APK y lo preparamos para la descarga
          mkdir -p out
          find app_novalauncher/build/outputs/apk/debug/ -name "*.apk" -exec cp {} out/nova-launcher-debug.apk \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-launcher-apk
          path: out/nova-launcher-debug.apk
