name: Nova Launcher Build Final
on:
  push:
    branches: [ v3_openjdk ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Nova Launcher APK
        run: |
          # 1. Preparar archivos mínimos necesarios
          chmod +x gradlew
          mkdir -p app_novalauncher/src/main/assets/components/lwjgl3
          echo "3.3.3" > app_novalauncher/src/main/assets/components/lwjgl3/version
          
          # 2. Compilar SOLO el APK, ignorando errores de otros módulos
          # El parámetro --continue permite que si algo falla, siga adelante con el resto
          ./gradlew :app_novalauncher:assembleDebug --no-daemon --continue || true
          
          # 3. Buscar el APK resultante
          mkdir -p out
          find . -name "*debug.apk" -exec cp {} out/nova-launcher-debug.apk \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-launcher-apk
          path: out/nova-launcher-debug.apk
          if-no-files-found: error
