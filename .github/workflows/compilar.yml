name: Nova Launcher Build Final
on:
  push:
    branches: [ v3_openjdk ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Nova Launcher APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --continue || true
          mkdir -p out
          # Buscamos el APK y lo movemos a la carpeta out
          find . -name "*debug.apk" -type f -exec cp {} out/nova-launcher.apk \;
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Nova Launcher v1.0.0
          files: out/nova-launcher.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
