name: Nova Launcher Build Final
on:
  push:
    branches: [ v3_openjdk ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - name: Build Nova Launcher APK
        run: |
          # Asegurar permisos de ejecución
          chmod +x gradlew
          chmod +x scripts/languagelist_updater.sh
          
          # Actualizar lista de idiomas
          ./scripts/languagelist_updater.sh
          
          # Crear archivo de versión faltante para evitar errores de LWJGL
          mkdir -p app_novalauncher/src/main/assets/components/lwjgl3
          echo "3.3.3" > app_novalauncher/src/main/assets/components/lwjgl3/version
          
          # COMANDO MAESTRO: Compila cualquier tarea de ensamblado de depuración
          ./gradlew assembleDebug --no-daemon
          
          # Buscar el APK generado y moverlo a la carpeta de salida
          mkdir -p out
          find . -name "*debug.apk" -exec cp {} out/nova-launcher-debug.apk \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-launcher-apk
          path: out/nova-launcher-debug.apk
