name: Nova Launcher Build Final
on:
  push:
    branches: [ v3_openjdk ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Nova Launcher APK
        run: |
          chmod +x gradlew
          # Intentamos compilar el proyecto principal
          ./gradlew assembleDebug --no-daemon --continue || true
          
          # Buscamos CUALQUIER archivo APK que se haya generado en todo el repositorio
          mkdir -p out
          find . -name "*.apk" -type f -exec cp {} out/nova-launcher-debug.apk \;
          
          # Verificamos si se encontró algo para que no falle el siguiente paso
          ls -R out/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-launcher-apk
          path: out/*.apk
          if-no-files-found: warn
