name: Nova Launcher Build Final
on:
  push:
    branches: [ v3_openjdk ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - name: Build Nova Launcher APK
        run: |
          # Aseguramos que los scripts tengan permiso
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          
          # Creamos los archivos que faltan para que no de error
          mkdir -p app_pojavlauncher/src/main/assets/components/lwjgl3
          echo "3.3.3" > app_pojavlauncher/src/main/assets/components/lwjgl3/version
          
          # Compilamos directamente el APK de depuración
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon
          
          # Movemos el resultado a una carpeta de salida
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/nova-launcher-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-launcher-apk
          path: out/nova-launcher-debug.apk

